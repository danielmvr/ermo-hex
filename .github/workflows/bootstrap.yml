name: ERMO | Instalacao inicial v0.2
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/ermo-v02.tar.xz.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ermo-bootstrap-main
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar motor e Chat-Commit
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/ermo-v02.tar.xz.b64 > "$RUNNER_TEMP/ermo.tar.xz"
          tar -xJf "$RUNNER_TEMP/ermo.tar.xz" -C .
          rm -rf .bootstrap
          rm -f .github/workflows/chat-commit.yml .github/workflows/ci.yml .github/workflows/pages.yml
          node --test tests/*.test.mjs
          node scripts/build-site.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: instalar ERMO Hex e Chat-Commit v0.2"
          git push origin HEAD:main
